<!-- The page you present from: it loads the deck in this folder (deck.js and slides/) into the reveal
     shell. You rarely need to edit it; the slides are in slides/<id>.js and their order in deck.js.
     The import map points "stepdeck/" at the engine copied into this deck (./stepdeck/), so the deck
     runs offline from any static server. Open it with `stepdeck serve`, not from file://.
     Docs: https://horaciochacon.github.io/stepdeck/site/docs/ -->
<script>
  if (new URLSearchParams(location.search).has("capture")) document.documentElement.classList.add("capture");
</script>
<script type="importmap">{ "imports": { "stepdeck/": "./stepdeck/" } }</script>
</head>
<body>
<script type="module">
  import { boot } from "stepdeck/core/stepdeck.js";
  boot({ shell: "reveal" });
</script>
</body>
