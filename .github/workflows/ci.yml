name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; the Pages jobs ask for the permissions they need.
permissions:
  contents: read

env:
  # Playwright is installed on the runner only (not a project dependency) and drives the runner's Google Chrome.
  PLAYWRIGHT_VERSION: 1.58.0
  STEPDECK_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright

jobs:
  # Fast gate: unit tests (with validate on the example and gallery decks) and the site smoke test. The deploy waits
  # only for this job and for the upload.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The test scripts need Node 22.15+ (module.registerHooks); the CLI's own floor (`engines`) is Node 20.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --no-audit --no-fund playwright@$PLAYWRIGHT_VERSION
      - name: Site smoke test
        run: node --test test/browser/site.test.mjs

  # The full browser suite on six runners (each runs its files one at a time): the status check; it does not gate
  # the deploy.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund playwright@$PLAYWRIGHT_VERSION
      - name: Browser tests (shard ${{ matrix.shard }} of 6)
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/6 'test/browser/**/*.test.mjs'

  # Upload the repository tree as it is (no build step), in parallel with the gate. Upload and deploy are separate
  # jobs, as in GitHub's starter workflows: the artifact has registered before the deploy job asks for it.
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: [unit, pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
