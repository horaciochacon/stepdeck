name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; the deploy job asks for the Pages permissions it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The test scripts need Node 22.15+ (module.registerHooks in test/unit/helpers/no-ajv.mjs);
          # the CLI's own floor, `engines` in package.json, is Node 20.
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests, including validate on the example and gallery decks.
      - run: npm test
      # Playwright is installed on the runner only; it is not a project dependency.
      # The runner's preinstalled Google Chrome is used through the default channel "chrome".
      - run: npm install --no-save --no-audit --no-fund playwright@1.58.0
      # Browser tests, including check --played on examples/kit, examples/spike and site/gallery
      # (the gallery under both shipped themes).
      - name: Browser tests
        run: npm run test:browser
        env:
          STEPDECK_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright

  # The site is the repository tree as it is (no build step). Uploading and deploying are separate jobs, as in
  # GitHub's starter workflows: the job boundary gives the artifact time to register, and re-running a failed
  # deploy reuses the one artifact instead of uploading a second.
  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
